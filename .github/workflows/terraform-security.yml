name: 🔒 Terraform Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: "us-east-1"
  
permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write  # Para OIDC

jobs:
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Install Checkov
      run: |
        pip install checkov
        checkov --version
        
    - name: 🔍 Run Checkov Security Scan
      run: |
        checkov -d . \
          --framework terraform \
          --output cli \
          --output sarif \
          --output-file-path console,checkov-report.sarif \
          --soft-fail \
          --compact
          
    - name: 📊 Upload Checkov SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: checkov-report.sarif
        
    - name: 📋 Comment PR with Security Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('checkov-report.sarif')) {
            const sarif = JSON.parse(fs.readFileSync('checkov-report.sarif', 'utf8'));
            const results = sarif.runs[0].results || [];
            
            let comment = '## 🛡️ Security Scan Results\n\n';
            comment += `**Total Issues Found:** ${results.length}\n\n`;
            
            if (results.length > 0) {
              comment += '### ⚠️ Security Issues:\n';
              results.slice(0, 10).forEach((result, index) => {
                comment += `${index + 1}. **${result.ruleId}**: ${result.message.text}\n`;
                comment += `   📍 File: ${result.locations[0].physicalLocation.artifactLocation.uri}\n\n`;
              });
              
              if (results.length > 10) {
                comment += `... and ${results.length - 10} more issues. Check the full report in Security tab.\n`;
              }
            } else {
              comment += '✅ No security issues found!';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  terraform-validate:
    name: 🔧 Terraform Validate
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🏗️ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: 🔧 Terraform Init
      run: terraform init -backend=false
      
    - name: ✅ Terraform Validate
      run: terraform validate
      
    - name: 📐 Terraform Format Check
      run: terraform fmt -check -recursive

  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [security-scan, terraform-validate]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🏗️ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: 🔐 Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: 🔧 Terraform Init
      run: terraform init
      
    - name: 📋 Terraform Plan
      id: plan
      run: |
        terraform plan -no-color -out=tfplan
        terraform show -no-color tfplan > plan.txt
        
    - name: 💬 Comment PR with Plan
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('plan.txt', 'utf8');
          const maxLength = 65000;
          
          let comment = '## 📋 Terraform Plan\n\n';
          
          if (plan.length > maxLength) {
            comment += '⚠️ Plan output is too long. Showing first part...\n\n';
            comment += '```hcl\n' + plan.substring(0, maxLength) + '\n...\n```';
          } else {
            comment += '```hcl\n' + plan + '\n```';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: [security-scan, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🏗️ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: 🔐 Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: 🔧 Terraform Init
      run: terraform init
      
    - name: 🚀 Terraform Apply
      run: terraform apply -auto-approve